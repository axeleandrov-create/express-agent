        </div>
        <div class="stat-leg-right">
          <div class="stat-leg-ai">${aiHtml}</div>
          <div class="stat-leg-right-foot">
            ${renderLegOutcomeMini(leg)}
            <button class="btn-stat-leg-fold" type="button" data-stat-leg-fold="${escapeHtml(legKey)}">${factsOpen ? "Свернуть" : "Подробнее"}</button>
          </div>
          <div class="stat-leg-facts-wrap">
            ${hint ? `<div class="stat-leg-hint">${escapeHtml(hint)}</div>` : ""}
            ${factsHtml || `<div class="hint-r" style="margin:0">Факты подтянутся после обновления ленты.</div>`}
          </div>
        </div>
      </div>`;
    }

    function renderLegStatsPanel(legs, entry) {
      const blocks = (legs || []).map((leg) => renderStatLegGridRow(leg, entry)).join("");
      if (!blocks) {
        return `<div class="stat-leg-panel"><div class="hint" style="margin:0">Нет ног в купоне.</div></div>`;
      }
      return `<div class="stat-leg-panel">${blocks}</div>`;
    }

    function renderExpressOddsLine(e, when) {
      const odds = displayExpressOdds(e);
      const show = odds.show > 0 ? odds.show.toFixed(2) : "—";
      const calcHint =
        odds.isBook && Math.abs(odds.book - odds.calc) > 0.01
          ? `<span class="stat-kf-calc">расч. ×${odds.calc.toFixed(2)}</span>`
          : "";
      if (editingOddsId === e.id) {
        const draft = show !== "—" ? show : "";
        return `<div class="meta-line stat-odds-row stat-kf-edit-wrap">
          <span>${when}</span>
          <span class="stat-kf-edit">
            <label for="kf-${e.id}">КФ БК</label>
            <input id="kf-${e.id}" type="text" inputmode="decimal" class="stat-kf-input" data-odds-input="${e.id}" value="${draft}" />
            <button class="btn stat-kf-save" type="button" data-save-odds="${e.id}">OK</button>
            <button class="btn stat-kf-cancel" type="button" data-cancel-odds-edit>Отмена</button>
          </span>
        </div>`;
      }
      return `<div class="meta-line stat-odds-row">
        <span>${when}</span>
        <span class="stat-kf-wrap">
          · <span class="stat-kf-book">×${show}</span>${calcHint}
          <button class="btn-kf-edit" type="button" data-edit-odds="${e.id}" title="КФ из БК">⋯</button>
        </span>
      </div>`;
    }

    function renderStatsMode(history) {
      const items = repairExpressHistory(history || loadExpressHistory(), { persist: true });
      expressHistoryCache = items;
      const stats = expressHistoryStats(items);
      const pending = items.filter((e) => e.result === "pending");
      const done = items.filter((e) => e.result === "win" || e.result === "loss");

      const renderEntry = (e) => {
        const pill =
          e.result === "win"
            ? `<span class="stat-pill win">зашло</span>`
            : e.result === "loss"
              ? `<span class="stat-pill loss">мимо</span>`
              : `<span class="stat-pill pending">в работе</span>`;
        const when = e.takenAt ? formatKickoff(e.takenAt) : "";
        const cancelBtn =
          e.result === "pending"
            ? `<button class="btn btn-cancel" type="button" data-cancel-express="${escapeHtml(e.id)}">Отменить</button>`
            : "";
        const scoresOpen = statScoresOpen.has(e.id);
        return `<div class="block stat-entry${scoresOpen ? "" : " compact"}" data-express-id="${escapeHtml(e.id)}">
          <div class="stat-coupon-head">
            <div class="stat-coupon-head-info">
              <div class="sec">${escapeHtml(e.title || LEVEL_LABEL[e.level] || "Экспресс")} ${pill}</div>
              ${renderExpressOddsLine(e, when)}
            </div>
            <button class="btn-stat-fold" type="button" data-stat-fold="${escapeHtml(e.id)}">${scoresOpen ? "Свернуть" : "Развернуть"}</button>
          </div>
          <div class="stat-coupon-body">
            ${renderLegStatsPanel(e.legs, e)}
          </div>
          ${cancelBtn}
        </div>`;
      };

      const activeOn = statsSubView === "active" ? " on" : "";
      const archiveOn = statsSubView === "archive" ? " on" : "";

      const toolbar = `<div class="stat-toolbar">
        <button class="stat-cube stat-cube-live${activeOn}" type="button" data-stats-view="active" title="В лайве">${stats.pending || 0} LIVE</button>
        <button class="stat-cube${archiveOn}" type="button" data-stats-view="archive" title="Сыгранные">Сыгранные${stats.done ? `<span class="stat-cube-n">${stats.done}</span>` : ""}</button>
      </div>`;

      const pendingHtml =
        statsSubView === "active"
          ? pending.length
            ? pending.map(renderEntry).join("")
            : `<div class="hint">Нет купонов в работе — возьми экспресс или собери свой в «Одинары A».</div>`
          : "";

      const doneHtml =
        statsSubView === "archive"
          ? done.length
            ? done.slice(0, 40).map(renderEntry).join("")
            : `<div class="hint">Сыгранных купонов пока нет — здесь появятся итоги: зашло или мимо.</div>`
          : "";

      return `${toolbar}${pendingHtml}${doneHtml}`;
    }

    async function refreshStatsTab() {
      contentEl.innerHTML = `<div class="hint">Обновляю ленту и счёт…</div>`;
      expressHistoryCache = await settleExpressHistory();
      await load(false);
    }

    function renderCustomPickBar() {
      if (!customPickMode || viewMode !== "a") return "";
      const legs = getSelectedCustomLegs();
      const kf = calcLegsOdds(legs);
      return `<div class="custom-pick-bar">
        <div class="custom-pick-meta">
          <strong>Выбрано: ${customPicks.size}</strong>
          ${customPicks.size >= 2
            ? `<span>кф ~×${kf.toFixed(2)}</span>`
            : `<span>нужно минимум 2 матча</span>`}
        </div>
        <div class="custom-pick-actions">
          <button class="btn" type="button" data-custom-cancel>Отмена</button>
          <button class="btn on" type="button" data-custom-confirm${customPicks.size < 2 ? " disabled" : ""}>В статистику</button>
        </div>
      </div>`;
    }

    function renderSinglesMode() {
      if (viewMode === "express") {
        return renderExpressMode();
      }
      if (viewMode === "stats") {
        return renderStatsMode(expressHistoryCache);
      }
      const by = viewMode === "archive"
        ? (board.singlesArchiveBySport || {})
        : (board.singlesBySport || {});
      const active = sportsWithData(by);
      if (active.length) {
        if (!active.some((t) => t.id === sportTab)) sportTab = active[0].id;
      } else if (viewMode === "a") {
        // запас: вдруг объект пустой, а счётчик есть
        sportTab = "football";
      }

      const sportTabsHtml = active.length > 1
        ? `<div class="sport-tabs">${active.map((t) => {
            const n = (by[t.id] || []).length;
            return `<button class="btn${t.id === sportTab ? " on" : ""}" data-sport="${t.id}" type="button">${t.label} (${n})</button>`;
          }).join("")}</div>`
        : "";

      const sportMeta = SPORT_TABS.find((t) => t.id === sportTab) || active[0];
      const list = by[sportTab] || [];
      const title = viewMode === "archive" ? "Архив B/C (dev)" : "Одинары A";
      const totalHint = viewMode === "archive"
        ? (board.singlesArchiveCount ?? 0)
        : (board.singlesCount ?? 0);

      if (!list.length && !active.length) {
        return `<div class="block"><div class="sec">${title}</div>
          <div class="hint">Сейчас пусто (в ответе сервера ${totalHint}). Нажми F5 или подожди обновление.</div></div>`;
      }

      return `
        <div class="block" style="padding-bottom:8px">
          <div class="singles-head">
            <div>
              <div class="sec">${title}</div>
              <div class="tier-legend">
                ${viewMode === "archive"
                  ? `<span><span class="tier B">B</span> средний</span>
                     <span><span class="tier C">C</span> слабый / мало данных</span>
                     <span>A скрыты — они в основной вкладке</span>`
                  : `<span><span class="tier A">A</span> сильный сигнал — в ленте</span>
                     <span>B/C → вкладка Dev</span>`}
              </div>
            </div>
            ${viewMode === "a"
              ? `<button class="btn btn-custom-express${customPickMode ? " on" : ""}" type="button" id="btnCustomExpress">${customPickMode ? "Отмена" : "Собрать свой экспресс"}</button>`
              : ""}
          </div>
          ${sportTabsHtml}
        </div>
        ${renderSingles(list, sportMeta?.label || sportTab, { archive: viewMode === "archive" })}
        ${renderCustomPickBar()}
      `;
    }

    let expressHistoryCache = [];

    function syncViewButtons() {
      document.querySelectorAll("[data-view]").forEach((b) => {
        b.classList.toggle("on", b.dataset.view === viewMode);
      });
      const statsBtn = document.getElementById("viewTabStats");
      if (statsBtn) {
        const items = expressHistoryCache.length
          ? expressHistoryCache
          : repairExpressHistory(loadExpressHistory(), { persist: false });
        const { pending } = expressHistoryStats(items);
        statsBtn.textContent = pending ? `В работе (${pending})` : "В работе";
      }
    }

    async function render(opts = {}) {
      const skipSettle = Boolean(opts.skipSettle);
      syncViewButtons();
      if (viewMode === "stats" && !skipSettle) {
        expressHistoryCache = await settleExpressHistory();
      }
      try {
        contentEl.innerHTML = renderSinglesMode();
      } catch (e) {
        console.error(e);
        contentEl.innerHTML = `<div class="hint">Ошибка отрисовки: ${escapeHtml(e?.message || e)}. Обнови страницу.</div>`;
        return;
      }

      if (editingOddsId) {
        const input = contentEl.querySelector(`[data-odds-input="${editingOddsId}"]`);
        if (input) {
          input.focus();
          input.select();
        }
      }

      document.body.classList.toggle("custom-pick-open", customPickMode && viewMode === "a");

      document.getElementById("btnCustomExpress")?.addEventListener("click", () => {
        toggleCustomPickMode();
      });

      document.querySelectorAll("[data-cancel-express]").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const id = btn.dataset.cancelExpress;
          if (id) cancelExpress(id);
        });
      });
      wireExpressButtons();
      document.querySelectorAll("[data-stats-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          statsSubView = btn.dataset.statsView === "archive" ? "archive" : "active";
          saveStatsSubView(statsSubView);
          render();
        });
      });
      document.querySelectorAll("[data-sport]").forEach((b) => {
        b.addEventListener("click", () => {
          sportTab = b.dataset.sport;
          openKey = null;
          render();
        });
      });
      document.querySelectorAll("[data-single]").forEach((el) => {
        el.addEventListener("click", () => {
          if (customPickMode && viewMode === "a") {
            const pickKey = el.dataset.matchPick;
            if (!pickKey) return;
            if (customPicks.has(pickKey)) customPicks.delete(pickKey);
            else customPicks.add(pickKey);
            render();
            return;
          }
          const k = el.dataset.single;
          openKey = openKey === k ? null : k;
          render();
        });
      });
    }

    let warmPollTimer = null;
    let warmHealthTimer = null;
    let firstLoad = true;

    function warmHintHtml(extra = "") {
      return `<div class="hint">Прогрев ленты… после перезапуска это может занять до 2 минут.${extra ? `<br><span id="warm-progress">${escapeHtml(extra)}</span>` : ""}</div>`;
    }

    function stopWarmHealthPoll() {
      if (warmHealthTimer) {
        clearInterval(warmHealthTimer);
        warmHealthTimer = null;
      }
    }

    function startWarmHealthPoll() {
      stopWarmHealthPoll();
      warmHealthTimer = setInterval(async () => {
        try {
          const res = await fetch("/api/health", { cache: "no-store" });
          const el = document.getElementById("warm-progress");
          if (!el) return;
          if ([404, 502, 503].includes(res.status)) {
            el.textContent = "Облачный сервер просыпается… обычно 30–60 сек, не закрывай вкладку.";
            return;
          }
          if (!res.ok) return;
          const h = await res.json();
          if (h.warming) {
            const n = Number(h.matches) || 0;
            el.textContent = n > 0
              ? `Сервер собирает ленту… уже ${n} матчей в обработке.`
              : "Сервер проснулся, собираем матчи…";
          } else if ((Number(h.matches) || 0) > 0) {
            el.textContent = `Готово: ${h.matches} матчей. Догружаю на экран…`;
          }
        } catch {
          /* ignore */
        }
      }, 3000);
    }

    function isWakeStatus(status) {
      return status === 404 || status === 502 || status === 503;
    }

    async function fetchBoardUntilReady(url, signal) {
      const started = Date.now();
      const maxMs = 180000;
      while (Date.now() - started < maxMs) {
        let res;
        try {
          res = await fetch(url, { cache: "no-store", signal });
        } catch (e) {
          if (e?.name === "AbortError") throw e;
          await new Promise((r) => setTimeout(r, 4000));
          continue;
        }
        if (!res.ok) {
          if (!isWakeStatus(res.status)) throw new Error(`HTTP ${res.status}`);
          const el = document.getElementById("warm-progress");
          if (el) {
            el.textContent = "Облачный сервер просыпается… обычно 30–60 сек, не закрывай вкладку.";
          } else {
            contentEl.innerHTML = warmHintHtml("Облачный сервер просыпается… обычно 30–60 сек.");
          }
          await new Promise((r) => setTimeout(r, 4000));
          continue;
        }
        const data = await res.json();
        if (!isBoardWarming(data)) return data;
        const el = document.getElementById("warm-progress");
        if (el) {
          el.textContent = data.note || "Сервер собирает матчи… подожди до минуты.";
        }
        await new Promise((r) => setTimeout(r, 4000));
      }
      throw new Error("HTTP 404");
    }

    async function enrichBoardAfterLoad() {
      try {
        expressHistoryCache = await settleExpressHistory();
        const refreshed = await refreshCapperExpressesAgainstHistory();
        const filled = await ensureMissingCapperExpresses(["safe", "medium", "risky"]);
        syncTakenMarksWithBoard();
        if (refreshed || filled || expressHistoryCache) await render({ skipSettle: true });
      } catch (e) {
        console.warn("post-load enrich:", e);
      }
    }

    function isBoardWarming(data = board) {
      const fb = (data.singlesBySport?.football || []).length;
      return (
        data.warming ||
        (!data.error && fb === 0 && (data.singlesCount || 0) === 0 && (data.matchCount || 0) === 0)
      );
    }

    function scheduleWarmPoll() {
      if (warmPollTimer) clearTimeout(warmPollTimer);
      if (!isBoardWarming()) return;
      warmPollTimer = setTimeout(() => load(false), 5000);
    }

    async function load(force) {
      const warmingUi = force ? false : isBoardWarming();
      if (force) stopWarmHealthPoll();
      else if (warmingUi || firstLoad) startWarmHealthPoll();
      contentEl.innerHTML = force
        ? `<div class="hint">Тянем свежие матчи…</div>`
        : warmingUi || firstLoad
          ? warmHintHtml()
          : `<div class="hint">Загрузка…</div>`;
      try {
        const ctrl = new AbortController();
        const timeoutMs = force || firstLoad || warmingUi ? 180000 : 30000;
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        const url = force ? "/api/matches?refresh=1" : "/api/matches";
        if (firstLoad || warmingUi) {
          board = await fetchBoardUntilReady(url, ctrl.signal);
        } else {
          const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          board = await res.json();
        }
        clearTimeout(timer);
        firstLoad = false;
        stopWarmHealthPoll();

        const fb = (board.singlesBySport?.football || []).length;
        if (isBoardWarming(board)) {
          showBanner(board.note || "Прогрев… подожди, страница обновится сама (до 2 минут).", true);
        } else if (board.error) showBanner(board.error, true);
        else showBanner("");

        sportTab = "football";
        await render();
        enrichBoardAfterLoad();
        scheduleWarmPoll();
      } catch (e) {
        if (
          (e?.name === "AbortError" || /HTTP 404|HTTP 502|HTTP 503/.test(String(e?.message || ""))) &&
          (firstLoad || isBoardWarming())
        ) {
          showBanner("Сервер просыпается… не закрывай вкладку, подожди до 2 минут.", true);
          contentEl.innerHTML = warmHintHtml("Жду ответ сервера…");
          startWarmHealthPoll();
          scheduleWarmPoll();
          return;
        }
        stopWarmHealthPoll();
        const msg = e?.name === "AbortError"
          ? "Слишком долго нет ответа — обнови страницу (F5)."
          : `Не удалось загрузить данные (${e?.message || "сеть"}).`;
        showBanner(msg, true);
        contentEl.innerHTML = `<div class="hint">${escapeHtml(msg)}</div>`;
      }
    }

    document.querySelectorAll("[data-view]").forEach((b) => {
      b.addEventListener("click", async () => {
        const wasStats = viewMode === "stats";
        viewMode = b.dataset.view;
        saveViewMode(viewMode);
        openKey = null;
        if (viewMode !== "a") {
          customPickMode = false;
          customPicks = new Set();
          document.body.classList.remove("custom-pick-open");
        }
        if (viewMode === "stats") {
          expressHistoryCache = await settleExpressHistory();
          if (wasStats) {
            statsSubView = "active";
            saveStatsSubView(statsSubView);
          }
        }
        if (viewMode === "express") {
          const cap = board.capperExpresses || {};
          const hasAny = ["safe", "medium", "risky"].some((k) => cap[k]?.matches?.length);
          if (!hasAny && !board.warming) load(true);
          else enrichBoardAfterLoad();
        }
        await render();
        if (!board.error && !isBoardWarming(board)) showBanner("");
      });
    });

    syncViewButtons();

    contentEl.addEventListener("click", (ev) => {
      const toggleBtn = ev.target.closest("[data-ex-toggle]");
      if (toggleBtn) {
        ev.preventDefault();
        const level = toggleBtn.dataset.exToggle;
        if (!level) return;
        if (expressOpenLevels.has(level)) expressOpenLevels.delete(level);
        else expressOpenLevels.add(level);
        render();
        return;
      }
      const legToggle = ev.target.closest("[data-ex-leg]");
      if (legToggle) {
        ev.preventDefault();
        ev.stopPropagation();
        const legKey = legToggle.dataset.exLeg;
        if (!legKey) return;
        if (expressOpenLegs.has(legKey)) expressOpenLegs.delete(legKey);
        else expressOpenLegs.add(legKey);
        render({ skipSettle: true });
        return;
      }
      const statLegFoldBtn = ev.target.closest("[data-stat-leg-fold]");
      if (statLegFoldBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        const legKey = statLegFoldBtn.dataset.statLegFold;
        if (!legKey) return;
        if (statLegFactsOpen.has(legKey)) statLegFactsOpen.delete(legKey);
        else statLegFactsOpen.add(legKey);
        render({ skipSettle: true });
        return;
      }
      const statFoldBtn = ev.target.closest("[data-stat-fold]");
      if (statFoldBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        const id = statFoldBtn.dataset.statFold;
        if (!id) return;
        if (statScoresOpen.has(id)) statScoresOpen.delete(id);
        else statScoresOpen.add(id);
        render({ skipSettle: true });
        return;
      }
      const compactBody = ev.target.closest(".stat-entry.compact .stat-coupon-body");
      if (compactBody && !ev.target.closest("button, input, a")) {
        ev.preventDefault();
        const entry = compactBody.closest("[data-express-id]");
        const id = entry?.dataset.expressId;
        if (id) {
          statScoresOpen.add(id);
          render({ skipSettle: true });
        }
        return;
      }
      const takeBtn = ev.target.closest("[data-take-express]");
      if (takeBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        const level = takeBtn.dataset.takeExpress;
        if (!level || expressReplacing) return;
        if (takeBtn.classList.contains("taken")) {
          showToast("Уже в статистике");
          return;
        }
        takeExpress(level);
        return;
      }
      const replaceBtn = ev.target.closest("[data-replace-express]");
      if (replaceBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        const level = replaceBtn.dataset.replaceExpress;
        if (level && !expressReplacing) replaceExpress(level, false);
        return;
      }
      const replaceOk = ev.target.closest("[data-replace-confirm]");
      if (replaceOk) {
        ev.preventDefault();
        ev.stopPropagation();
        const level = replaceOk.dataset.replaceConfirm;
        if (level) replaceExpress(level, true);
        return;
      }
      const replaceNo = ev.target.closest("[data-replace-cancel]");
      if (replaceNo) {
        ev.preventDefault();
        ev.stopPropagation();
        expressReplaceConfirm = null;
        render({ skipSettle: true });
        return;
      }
      const editBtn = ev.target.closest("[data-edit-odds]");
      if (editBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        editingOddsId = editBtn.dataset.editOdds || null;
        render({ skipSettle: true });
        return;
      }
      const saveBtn = ev.target.closest("[data-save-odds]");
      if (saveBtn) {
        ev.preventDefault();
        ev.stopPropagation();
        const id = saveBtn.dataset.saveOdds;
        const input = contentEl.querySelector(`[data-odds-input="${id}"]`);
        if (id && saveExpressBookOdds(id, input?.value)) {
          render({ skipSettle: true });
        }
        return;
      }
      if (ev.target.closest("[data-cancel-odds-edit]")) {
        ev.preventDefault();
        ev.stopPropagation();
        editingOddsId = null;
        render({ skipSettle: true });
        return;
      }
      if (ev.target.closest("[data-custom-confirm]")) {
        ev.preventDefault();
        ev.stopPropagation();
        confirmCustomExpress();
        return;
      }
      if (ev.target.closest("[data-custom-cancel]")) {
        ev.preventDefault();
        ev.stopPropagation();
        toggleCustomPickMode(false);
      }
    });

    contentEl.addEventListener("keydown", (ev) => {
      if (ev.key !== "Enter") return;
      const input = ev.target.closest("[data-odds-input]");
      if (!input) return;
      ev.preventDefault();
      const id = input.dataset.oddsInput;
      if (id && saveExpressBookOdds(id, input.value)) {
        render({ skipSettle: true });
      }
    });

    load(false);
  </script>
</body>
</html>
